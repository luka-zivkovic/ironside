server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxied to the api container by name — set via docker-compose's
  # service DNS ("api"), overridable at build/run time if self-hosting
  # with a different service name.
  location /api/ {
    proxy_pass http://api:8788;
    proxy_set_header Host $host;
    # Never pass a client-supplied limiter identity through unchanged. If
    # AUTH_TRUST_PROXY is enabled with this nginx instance as the sole API
    # ingress, the API sees the address that actually connected to nginx.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /health {
    proxy_pass http://api:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # OTLP ingest is conventionally top-level (/v1/otel/*), not nested
  # under /api/ — see apps/api/src/app.ts's own comment on why. The SPA
  # has no client-side routes under /v1, so this can't collide with
  # react-router's paths.
  location /v1/ {
    proxy_pass http://api:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback: any other path serves index.html so client-side
  # routing (react-router) handles it, instead of nginx 404ing a direct
  # navigation to e.g. /traces/abc123.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
