name: Release containers

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: ironside
          POSTGRES_PASSWORD: ironside
          POSTGRES_DB: ironside
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ironside -d ironside"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.3.14.14-alpine
        env:
          CLICKHOUSE_USER: ironside
          CLICKHOUSE_PASSWORD: ironside
          CLICKHOUSE_DB: ironside
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user ironside --password ironside --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ironside:ironside@localhost:5433/ironside
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: ironside
      CLICKHOUSE_PASSWORD: ironside
      CLICKHOUSE_DB: ironside
      REDIS_URL: redis://localhost:6380
      S3_ENDPOINT: http://localhost:9010
      S3_ACCESS_KEY: ironside
      S3_SECRET_KEY: ironside123
      S3_BUCKET: ironside-raw
      S3_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v${package_version}"

      - name: Validate self-host release bundle
        shell: bash
        env:
          IRONSIDE_VERSION: 0.0.0
          IRONSIDE_POSTGRES_PASSWORD: release-render-postgres
          IRONSIDE_CLICKHOUSE_PASSWORD: release-render-clickhouse
          IRONSIDE_REDIS_PASSWORD: release-render-redis
          IRONSIDE_MINIO_PASSWORD: release-render-minio
          IRONSIDE_ENCRYPTION_SECRET: release-render-encryption-secret-at-least-32-bytes
          IRONSIDE_METRICS_TOKEN: release-render-metrics-token
        run: |
          (cd deploy/self-host && sha256sum -c compose.yaml.sha256)
          docker compose -f deploy/self-host/compose.yaml config --quiet

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9010:9000 \
            -e MINIO_ROOT_USER=ironside -e MINIO_ROOT_PASSWORD=ironside123 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9010/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio >&2
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published release tag
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/ironside-${{ matrix.image }}:${{ steps.version.outputs.value }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $image" >&2
            exit 1
          fi

      - name: Build and publish immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ironside-${{ matrix.image }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/ironside-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot and verify the published release bundle
        shell: bash
        env:
          IRONSIDE_VERSION: ${{ github.ref_name }}
          IRONSIDE_BIND_ADDRESS: 127.0.0.1
          IRONSIDE_PORT: 18080
          IRONSIDE_PUBLIC_URL: http://127.0.0.1:18080
          IRONSIDE_AUTH_INSECURE_COOKIES: "true"
          IRONSIDE_POSTGRES_PASSWORD: release-smoke-postgres
          IRONSIDE_CLICKHOUSE_PASSWORD: release-smoke-clickhouse
          IRONSIDE_REDIS_PASSWORD: release-smoke-redis
          IRONSIDE_MINIO_PASSWORD: release-smoke-minio
          IRONSIDE_ENCRYPTION_SECRET: release-smoke-encryption-secret-at-least-32-bytes
          IRONSIDE_METRICS_TOKEN: release-smoke-metrics-token
        run: |
          IRONSIDE_VERSION="${IRONSIDE_VERSION#v}"
          export IRONSIDE_VERSION
          project="ironside-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status=$?
            if ((status != 0)); then
              docker compose --project-name "$project" -f deploy/self-host/compose.yaml logs --no-color || true
            fi
            docker compose --project-name "$project" -f deploy/self-host/compose.yaml down -v --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose --project-name "$project" -f deploy/self-host/compose.yaml pull
          docker compose --project-name "$project" -f deploy/self-host/compose.yaml up -d
          healthy=0
          for attempt in $(seq 1 120); do
            if curl -fsS --max-time 5 http://127.0.0.1:18080/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          ((healthy == 1))
          docker compose --project-name "$project" -f deploy/self-host/compose.yaml \
            exec -T api node apps/api/dist/src/scripts/owner-setup.js \
            | grep -q 'ironside_setup_'
          docker compose --project-name "$project" -f deploy/self-host/compose.yaml ps

  draft-release:
    needs: smoke-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create operator-reviewed draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --draft
          --generate-notes
          --title "$GITHUB_REF_NAME"
