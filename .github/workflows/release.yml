name: Release

# Builds and publishes the api/worker/web images to GHCR whenever a
# version tag (vX.Y.Z) is pushed — the "release images build in CI" half
# of M7's fresh-machine-test DoD item. Distinct from ci.yml (which runs
# build/typecheck/test on every push/PR): this workflow only runs on
# tags, and only builds images — it does not re-run the test suite,
# since a tag is only pushed after ci.yml has already gone green on the
# commit being tagged.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, worker, web]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ironside-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ironside-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
