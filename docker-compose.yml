# Ironside local/self-host stack. Ports are offset to coexist with a local
# coeval instance (postgres 5433 vs 5432) and to avoid the ClickHouse native
# port clashing with MinIO's default 9000.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ironside
      POSTGRES_PASSWORD: ironside
      POSTGRES_DB: ironside
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironside -d ironside"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_USER: ironside
      CLICKHOUSE_PASSWORD: ironside
      CLICKHOUSE_DB: ironside
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      # Enables the native BACKUP/RESTORE statements (backups.allowed_path)
      # — see docs/self-hosting.md's Backups section.
      - ./docker/clickhouse-backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user ironside --password ironside --query 'SELECT 1'"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ironside
      MINIO_ROOT_PASSWORD: ironside123
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # mc is bundled in the minio image; curl has been removed from these
      # images before, so don't depend on it.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8788
      DATABASE_URL: postgres://ironside:ironside@postgres:5432/ironside
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ironside
      CLICKHOUSE_PASSWORD: ironside
      CLICKHOUSE_DB: ironside
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ironside
      S3_SECRET_KEY: ironside123
      S3_BUCKET: ironside-raw
      S3_REGION: us-east-1
      # The web container's nginx serves the app on :80 and proxies
      # /api + /health back to this service same-origin, so a browser
      # loading http://localhost:8080 never sends a cross-origin request
      # to the api at all — this default just covers direct API access
      # (curl, an external tool) for local/self-hosted use.
      WEB_ORIGINS: http://localhost:8080
      # The checked-in stack is explicitly plain-HTTP localhost, so it opts
      # out of Secure cookies. Remove this override behind TLS.
      AUTH_INSECURE_COOKIES: ${AUTH_INSECURE_COOKIES:-true}
      # Shared with worker: compatibility reads and scheduled consumers use
      # the same trace-completion watermark.
      DEFAULT_TRACE_QUIET_PERIOD_SECONDS: ${DEFAULT_TRACE_QUIET_PERIOD_SECONDS:-300}
      # Set to enable GET /metrics (Prometheus) on the API port; unset =
      # the endpoint is disabled entirely. See docs/self-hosting.md.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Required to store export/forward/webhook/import-source credentials
      # (AES-256-GCM at rest). Unset = those features error at save time.
      # Changing it orphans already-encrypted credentials — see the backup
      # caveat in docs/self-hosting.md.
      IRONSIDE_ENCRYPTION_SECRET: ${IRONSIDE_ENCRYPTION_SECRET:-}
    ports:
      - "8788:8788"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://ironside:ironside@postgres:5432/ironside
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ironside
      CLICKHOUSE_PASSWORD: ironside
      CLICKHOUSE_DB: ironside
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ironside
      S3_SECRET_KEY: ironside123
      S3_BUCKET: ironside-raw
      S3_REGION: us-east-1
      DEFAULT_TRACE_QUIET_PERIOD_SECONDS: ${DEFAULT_TRACE_QUIET_PERIOD_SECONDS:-300}
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-90}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-21600000}
      LIFECYCLE_PLAN_SCAN_LIMIT: ${LIFECYCLE_PLAN_SCAN_LIMIT:-100000}
      LIFECYCLE_PLAN_PROJECT_LIMIT: ${LIFECYCLE_PLAN_PROJECT_LIMIT:-1000}
      LIFECYCLE_PLAN_PROJECT_ID: ${LIFECYCLE_PLAN_PROJECT_ID:-}
      INGEST_RECOVERY_INTERVAL_MS: ${INGEST_RECOVERY_INTERVAL_MS:-30000}
      INGEST_RECOVERY_BATCH_SIZE: ${INGEST_RECOVERY_BATCH_SIZE:-1000}
      # Destructive raw retention remains off unless an operator opts in and
      # also invokes the separate command with --execute and exact intent ids.
      RAW_RETENTION_EXECUTION_ENABLED: ${RAW_RETENTION_EXECUTION_ENABLED:-false}
      # Optional bearer token for the worker's own :9464/metrics listener.
      # The port is deliberately NOT published — scrape it from inside the
      # compose network, or add a ports mapping if scraping externally
      # (then set this token). See docs/self-hosting.md.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Must match the api's value — the worker decrypts what the api
      # encrypted. See docs/self-hosting.md.
      IRONSIDE_ENCRYPTION_SECRET: ${IRONSIDE_ENCRYPTION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  chdata:
  miniodata:
